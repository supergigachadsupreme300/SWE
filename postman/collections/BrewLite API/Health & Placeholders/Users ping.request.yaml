$kind: http-request
url: "{{baseUrl}}/users"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', () => pm.response.to.have.status(200));
      pm.test('returns users placeholder message', () => {
        pm.expect(pm.response.json().message).to.eql('users endpoint placeholder');
      });
    language: text/javascript
order: 4000
