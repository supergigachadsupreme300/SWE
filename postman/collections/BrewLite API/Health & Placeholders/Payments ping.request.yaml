$kind: http-request
url: "{{baseUrl}}/payments"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', () => pm.response.to.have.status(200));
      pm.test('returns payments placeholder message', () => {
        pm.expect(pm.response.json().message).to.eql('payments placeholder');
      });
    language: text/javascript
order: 3000
