$kind: http-request
url: "{{baseUrl}}/auth/ping"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', () => pm.response.to.have.status(200));
      pm.test('returns auth placeholder message', () => {
        pm.expect(pm.response.json().message).to.eql('auth placeholder');
      });
    language: text/javascript
order: 1000
